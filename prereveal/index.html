<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>MotorHeads - Assembly Pending</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="archive" aria-label="MotorHeads prereveal archive">
      <img class="vault-art" src="vault.png" alt="A sealed mechanical archive vault" />
      <div class="vignette" aria-hidden="true"></div>
      <div class="ambient ambient-cyan" aria-hidden="true"></div>
      <div class="ambient ambient-gold" aria-hidden="true"></div>

      <div class="lock-system" aria-hidden="true">
        <div class="orbit orbit-outer"></div>
        <div class="orbit orbit-inner"></div>
        <div class="energy-seam"></div>
        <div class="lock-core"></div>
      </div>

      <canvas id="particles" aria-hidden="true"></canvas>

      <header class="archive-header">
        <span class="serial">MH // 5555</span>
        <span class="live"><i></i> ARCHIVE ONLINE</span>
      </header>

      <section class="status-panel" aria-label="Prereveal status">
        <p class="eyebrow">MOTORHEADS GENESIS ARCHIVE</p>
        <h1>ASSEMBLY PENDING</h1>
        <div class="progress" aria-hidden="true"><span></span></div>
        <p class="status-copy">IDENTITY SEALED <b>//</b> REVEAL SEQUENCE ARMED</p>
      </section>
    </main>
    <script src="animation.js"></script>
  </body>
</html>
