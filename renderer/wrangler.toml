# MotorHeads renderer — a NEW standalone worker, separate from the prod backend.
# Serves dynamic metadata (reads on-chain parts) + the customized image (R2) + the animation.
name = "motorheads-renderer"
main = "index.js"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]

# The customized-image snapshots (client-captured PNGs). Local `wrangler dev` simulates this.
[[r2_buckets]]
binding = "RENDERS"
bucket_name = "motorheads-renders"

[vars]
COLLECTION_NAME = "MotorHead"
# Reliable source of the ORIGINAL pinned metadata (Cloudflare Pages, byte-identical to the IPFS CID).
SOURCE_META_BASE = "https://motorheads-metadata.pages.dev"
# RENDER_BASE_URL defaults to the worker's own origin (used only for edited tokens' image/anim URLs).
# LIVE (2026-08-03): on-chain save is enabled — the mainnet MotorHeadsParts companion + a mainnet RPC.
# Unedited tokens still pass through byte-identical (readLayout returns empty + fails safe on RPC error).
PARTS_CONTRACT = "0xed26E94663FA23CFb952771111770474c4F1f082"
RENDER_RPC_URL = "https://ethereum-rpc.publicnode.com"
COLLECTION_ADDRESS = "0x0A5008550FC1402Bb567a3bA38d9433E6199CEb1"
